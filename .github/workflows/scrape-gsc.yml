name: prices

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          pip install cryptography curl_cffi playwright requests
          playwright install chromium --with-deps

      - env:
          GSC_FERNET_KEY: ${{ secrets.GSC_FERNET_KEY }}
        run: python3 scripts/scrape_encrypt_gsc.py

      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gsc.enc
          git diff --cached --quiet && echo "skip" || git commit -m "update"
          git push
